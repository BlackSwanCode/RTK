[tool.poetry]
name = "rtk"
version = "0.5.0"
description = "Red Team Toolkit — internal offensive security tooling (V4)"
authors = ["RTK Team <redteam@internal>"]
packages = [{include = "rtk"}]

[tool.poetry.dependencies]
python = "^3.11"
typer = "^0.12.3"
pydantic = "^2.7"
rich = "^13.7"
pyyaml = "^6.0"
sqlcipher3 = "^0.5.3"
cryptography = "^42.0"
boto3 = "^1.34"
requests = "^2.31"
jinja2 = "^3.1"
httpx = "^0.27.0"
uvicorn = "^0.30.0"
fastapi = "^0.110.0"
owslib = "^0.31.0"      # Pour l'analyse des capacités OGC (WMS/WFS)
subprocess-run = "^0.0.1" # (Optionnel, stdlib suffit, mais on note l'usage de gitleaks)

[tool.poetry.group.gcp.dependencies]
google-cloud-resource-manager = "^1.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-mock = "^3.14"
pytest-asyncio = "^0.23.0"
responses = "^0.25.0"   # Pour mocker les requêtes HTTP OGC dans les tests

[tool.poetry.scripts]
rtk = "rtk.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
